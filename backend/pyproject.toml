[project]
name = "ownai-backend"
version = "0.1.0"
description = "OwnAI — private multi-model, multi-agent AI developer platform (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "redis>=5.0",
    "qdrant-client>=1.12",
    "pyyaml>=6.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "cryptography>=43",
    "structlog>=24.4",
    "sqlglot>=25.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
norecursedirs = ["fixtures", ".*", "__pycache__"]
markers = [
    "integration: requires PostgreSQL/Redis/Qdrant (set OWNAI_TEST_DATABASE_URL etc.)",
    "live_model: requires a real model endpoint (set OWNAI_LIVE_MODEL_URL)",
    "sandbox: requires Docker and the sandbox runner",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM"]
ignore = ["S101", "S603", "S607", "B008", "S311", "UP040", "UP047", "E501", "ASYNC240", "ASYNC109", "SIM105", "SIM102"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108"]
